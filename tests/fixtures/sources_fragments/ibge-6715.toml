# Fragmento de fontes (sem instituição): só acrescenta datasets a ibge-test.toml.
config_version = "1.0.0"

# POF 6715 só no nível Brasil (fixtures de 2026-11-11, 744 valores por variável).
[[datasets]]
id = "ibge-sidra-6715"
source = "ibge-sidra"
official_id = "6715"
title = "Despesa média mensal familiar"
description = "teste"
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "anos de referência da pesquisa"

[datasets.params]
table = "6715"
variables = ["1201", "1204"]
territorial_levels = ["n1"]
classifications = { "c339" = "all", "c12190" = "all" }
split_by_variable = true
estimated_values_per_period = 744
min_rows = 744
max_rows = 744
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
series = "ibge-pof-despesa-familiar"
series_order = 3

