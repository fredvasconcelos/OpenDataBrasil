# Configuração de TESTE: mesmas fontes do configs/sources/ibge.toml, no nível UF (n3),
# compatível com as fixtures reais em tests/fixtures/ibge.
config_version = "test"

[institution]
id = "ibge"
name = "Instituto Brasileiro de Geografia e Estatística"
acronym = "IBGE"
url = "https://www.ibge.gov.br"

[[licenses]]
id = "ibge-reuso-com-citacao"
name = "Reuso de dados do IBGE com citação da fonte"
conditions = "Citação obrigatória."
review_status = "requires_review"

[[sources]]
id = "ibge-sidra"
name = "SIDRA"
connector = "sidra"
base_url = "https://apisidra.ibge.gov.br"

[sources.http]
min_interval_s = 0.0
max_attempts = 2
backoff_initial_s = 0.0

[[sources]]
id = "ibge-geoftp"
name = "geoftp"
connector = "http_file"
base_url = "https://geoftp.ibge.gov.br/"

[sources.http]
min_interval_s = 0.0
max_attempts = 2
backoff_initial_s = 0.0

