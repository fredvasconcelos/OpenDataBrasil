[project]
name = "odb-ingestion"
version = "0.1.0"
description = "Framework de ingestão: contrato de conectores, cliente HTTP robusto, Bronze imutável e conectores oficiais."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "odb-common",
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[tool.uv.sources]
odb-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_ingestion"
