[project]
name = "odb-lakehouse"
version = "0.1.0"
description = "Escrita e leitura Delta Lake (Polars + delta-rs), validação de protocolo e locks de escrita."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "odb-common",
    "polars==1.44.2",
    "deltalake==1.6.6",
    "pyarrow==26.0.0",
]

[tool.uv.sources]
odb-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_lakehouse"
