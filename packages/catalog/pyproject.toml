[project]
name = "odb-catalog"
version = "0.1.0"
description = "Catálogo operacional PostgreSQL: migrações, execuções, publicação de releases e locks."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "odb-common",
    "odb-ingestion",
    "sqlalchemy==2.0.55",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[tool.uv.sources]
odb-common = { workspace = true }
odb-ingestion = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_catalog"
