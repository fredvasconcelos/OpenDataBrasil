[project]
name = "odb-common"
version = "0.1.0"
description = "Utilitários compartilhados: configuração, logs estruturados e URIs de armazenamento."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_common"
