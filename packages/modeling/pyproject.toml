[project]
name = "odb-modeling"
version = "0.1.0"
description = "Modelagem Gold (Polars → Delta Lake): dimensões, fatos, estrutura universal de indicadores e qualidade."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "odb-common",
    "odb-ingestion",
    "odb-lakehouse",
    "odb-processing",
    "odb-semantics",
]

[tool.uv.sources]
odb-common = { workspace = true }
odb-ingestion = { workspace = true }
odb-lakehouse = { workspace = true }
odb-processing = { workspace = true }
odb-semantics = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_modeling"
