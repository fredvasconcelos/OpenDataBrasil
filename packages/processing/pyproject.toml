[project]
name = "odb-processing"
version = "0.1.0"
description = "Transformações Bronze → Silver (Polars), contratos de schema e verificações de qualidade."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "odb-common",
    "odb-ingestion",
    "odb-lakehouse",
    "fastexcel==0.21.0",
]

[tool.uv.sources]
odb-common = { workspace = true }
odb-ingestion = { workspace = true }
odb-lakehouse = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odb_processing"
