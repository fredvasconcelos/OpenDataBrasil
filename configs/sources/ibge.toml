# Fontes do IBGE.
# Identificadores, períodos e contagens conferidos por requisição real em 2026-11-03
# (ver docs/data_catalog/ibge.md). Não acrescente identificadores sem verificá-los na fonte.

config_version = "1.0.0"

[institution]
id = "ibge"
name = "Instituto Brasileiro de Geografia e Estatística"
acronym = "IBGE"
url = "https://www.ibge.gov.br"

[[licenses]]
id = "ibge-reuso-com-citacao"
name = "Reuso de dados do IBGE com citação da fonte"
url = "https://biblioteca.ibge.gov.br/biblioteca-servicos.html"
conditions = "Uso permitido com citação obrigatória do IBGE como fonte. Transformações devem identificar o responsável."
review_status = "requires_review"
notes = "Texto oficial não verificado: a página respondeu 403 para clientes automatizados em 2026-11-03. Condições baseadas em fontes secundárias; confirmar antes de publicação pública (§23)."

# ------------------------------------------------------------------ fontes

[[sources]]
id = "ibge-sidra"
name = "SIDRA: Sistema IBGE de Recuperação Automática (API)"
connector = "sidra"
base_url = "https://apisidra.ibge.gov.br"
documentation_url = "https://apisidra.ibge.gov.br/home/ajuda"

[sources.http]
min_interval_s = 2.0
timeout_s = 120.0
max_attempts = 5
backoff_initial_s = 2.0

[[sources]]
id = "ibge-geoftp"
name = "IBGE Geociências: downloads (geoftp)"
connector = "http_file"
base_url = "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/"

[sources.http]
min_interval_s = 2.0
timeout_s = 120.0

# ------------------------------------------------------------------ datasets

[[datasets]]
id = "ibge-sidra-6579"
source = "ibge-sidra"
official_id = "6579"
title = "População residente estimada"
description = "Estimativas anuais da população residente (variável 9324, Pessoas), por município. Anos sem estimativa na tabela (por exemplo, anos censitários) não são interpolados."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "anual"
reference_url = "https://sidra.ibge.gov.br/tabela/6579"

[datasets.params]
table = "6579"
variables = ["9324"]
# Brasil, Grandes Regiões, UFs e municípios na mesma consulta: os totais oficiais
# de cada nível permitem reconciliação sem recalcular agregados.
territorial_levels = ["n1", "n2", "n3", "n6"]
estimated_values_per_period = 5700
min_rows = 5590
max_rows = 5700
refresh_recent_periods = 2

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
# Variáveis somáveis entre níveis territoriais (reconciliação). "exact" = contagens inteiras.
additive_variables = { "9324" = "exact" }

[[datasets]]
id = "ibge-sidra-4714"
source = "ibge-sidra"
official_id = "4714"
title = "Censo Demográfico 2022: população residente, área territorial e densidade demográfica"
description = "População residente (93), área da unidade territorial (6318) e densidade demográfica (614), por município, no Censo 2022."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/4714"

[datasets.params]
table = "4714"
variables = ["93", "6318", "614"]
territorial_levels = ["n1", "n2", "n3", "n6"]
estimated_values_per_period = 17000
min_rows = 16700
max_rows = 17100
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
# Densidade (614) é razão e não é somável. A área usa a tolerância de arredondamento
# das casas decimais publicadas.
additive_variables = { "93" = "exact", "6318" = "rounding" }

[[datasets]]
id = "ibge-sidra-9605"
source = "ibge-sidra"
official_id = "9605"
title = "População residente, por cor ou raça (Censos 2010 e 2022)"
description = "População residente (93) por cor ou raça (classificação c86: Branca, Preta, Amarela, Parda, Indígena e Total), nos Censos 2010 e 2022. As cinco categorias não somam o Total: a tabela não publica a categoria sem declaração."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/9605"

[datasets.params]
table = "9605"
# 1000093 (percentual do total geral) é derivado da própria tabela e não é ingerido.
variables = ["93"]
territorial_levels = ["n1", "n2", "n3", "n6"]
# c86 conferido na API em 2026-11-04 (HTTP 200; códigos inválidos geram HTTP 400).
classifications = { "c86" = "all" }
estimated_values_per_period = 33618
min_rows = 33400
max_rows = 33700
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
additive_variables = { "93" = "exact" }

[[datasets]]
id = "ibge-sidra-9718"
source = "ibge-sidra"
official_id = "9718"
title = "Censo 2022: população residente, total e indígena, por localização do domicílio e quesito de declaração indígena"
description = "População residente (93), pessoas indígenas (350) e percentual de pessoas indígenas (4727), por quesito de declaração indígena (c1714) e localização do domicílio em relação a terras indígenas (c2661)."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/9718"

[datasets.params]
table = "9718"
# 1000093 e 1000350 (percentuais do total geral) são derivados e não são ingeridos.
variables = ["93", "350", "4727"]
territorial_levels = ["n1", "n2", "n3", "n6"]
# c2661 com as categorias listadas (Total, em e fora de terras indígenas), para
# dividir as requisições por categoria.
classifications = { "c1714" = "all", "c2661" = "32776,12869,12870" }
# A API limita cada consulta a 50.000 valores (HTTP 400 com 67.236 em 2026-11-04).
# Uma requisição por variável e por localização: 4 quesitos x 5603 territórios = 22.412.
split_by_variable = true
split_by_classification = "c2661"
estimated_values_per_period = 22412
min_rows = 22300
max_rows = 22500
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
additive_variables = { "93" = "exact", "350" = "exact" }

[[datasets]]
id = "ibge-sidra-9578"
source = "ibge-sidra"
official_id = "9578"
title = "Censo 2022: população residente, total e quilombola, por localização do domicílio"
description = "Pessoas quilombolas (4709), população residente (93) e percentual de pessoas quilombolas (4728), por localização do domicílio em relação a territórios quilombolas (c2661). Valores da segunda apuração (1.330.186 pessoas quilombolas no Brasil)."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/9578"

[datasets.params]
table = "9578"
# 1004709 (percentual do total geral) é derivado e não é ingerido.
variables = ["4709", "93", "4728"]
territorial_levels = ["n1", "n2", "n3", "n6"]
classifications = { "c2661" = "all" }
# 3 variáveis x 3 localizações x 5603 territórios = 50.427 passa do limite de 50.000:
# uma requisição por variável (16.809 valores).
split_by_variable = true
estimated_values_per_period = 16809
min_rows = 16700
max_rows = 16850
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
additive_variables = { "4709" = "exact", "93" = "exact" }

[[datasets]]
id = "ibge-sidra-9971"
source = "ibge-sidra"
official_id = "9971"
title = "Censo 2022: pessoas indígenas, por sexo, grupos de idade, localização e situação do domicílio"
description = "Pessoas indígenas (350) por sexo (c2), grupos quinquenais de idade (c58), localização do domicílio em relação a terras indígenas (c2661) e situação do domicílio (c1)."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/9971"

[datasets.params]
table = "9971"
# 1000350 (percentual do total geral) é derivado e não é ingerido.
variables = ["350"]
territorial_levels = ["n1", "n2", "n3", "n6"]
# Códigos conferidos na API em 2026-11-04 (HTTP 200).
classifications = { "c1" = "6795,1,2", "c2" = "6794,4,5", "c58" = "95253,1140,1141,1142,1143,1144,1145,1146,1147,1148,1149,1150,1151,1152,1153,1154,1155,6802,74120", "c2661" = "all" }
# 513 combinações x 5603 territórios = 2,87 milhões de valores. Limite: 50.000 por consulta.
# Uma requisição por sexo, grupo de idade e situação (3 x 19 x 3 = 171): 3 localizações x 5603 = 16.809.
split_by_classification = ["c2", "c58", "c1"]
estimated_values_per_period = 16809
min_rows = 16700
max_rows = 16850
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
additive_variables = { "350" = "exact" }

[[datasets]]
id = "ibge-sidra-9970"
source = "ibge-sidra"
official_id = "9970"
title = "Censo 2022: pessoas indígenas, por idade, localização e situação do domicílio"
description = "Pessoas indígenas (350) por idade (c287: grupos quinquenais, idades simples e meses de vida), localização do domicílio (c2661) e situação do domicílio (c1). Só Brasil, Grandes Regiões e UFs: o nível municipal teria 6,8 milhões de valores, e a idade por município é coberta pela tabela 9971."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "decenal"
reference_url = "https://sidra.ibge.gov.br/tabela/9970"

[datasets.params]
table = "9970"
variables = ["350"]
territorial_levels = ["n1", "n2", "n3"]
classifications = { "c1" = "all", "c2661" = "all", "c287" = "all" }
# 134 idades x 3 localizações x 3 situações = 1.206 combinações x 33 territórios.
estimated_values_per_period = 39798
min_rows = 39700
max_rows = 39800
refresh_recent_periods = 1

[datasets.silver]
transformer = "sidra_observation"
territorial_reference = "ibge-dtb"
additive_variables = { "350" = "exact" }

[[datasets]]
id = "ibge-dtb"
source = "ibge-geoftp"
official_id = "DTB_2025"
title = "Divisão Territorial Brasileira 2025"
description = "Relatórios oficiais da DTB (municípios, distritos e subdistritos, inclusive criados e extintos), em ODS e XLS."
license = "ibge-reuso-com-citacao"
access_classification = "public_conditional"
periodicity = "anual"
reference_url = "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/"

[datasets.params]
url = "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/DTB_2025.zip"
artifact_name = "dtb-2025.zip"
reference_period = "2025"
format = "zip"
expected_members = ["RELATORIO_DTB_BRASIL_*_MUNICIPIOS.ods", "RELATORIO_DTB_BRASIL_*_MUNICIPIOS.xls"]
min_bytes = 500000
max_bytes = 52428800

[datasets.silver]
transformer = "dtb_municipality"
member = "RELATORIO_DTB_BRASIL_*_MUNICIPIOS.ods"
