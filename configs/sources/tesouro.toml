# Tesouro Nacional (STN): tabelas de apoio às contas públicas.
#
# TABMUN: município SIAFI × CNPJ da prefeitura × IBGE (ADR-0032). Em 2026-11-22, casou
# 5.570 dos 5.571 códigos SIAFI de transferências de 2025-10; ficou de fora 1182, Boa
# Esperança do Norte/MT (município novo; vai para o suplemento versionado). O CSV não tem
# cabeçalho: SIAFI;CNPJ;nome;UF;IBGE, ASCII, CRLF.

config_version = "1.0.0"

