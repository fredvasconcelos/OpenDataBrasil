review_status = "approved"
notes = "Aprovada pelo mantenedor em 2026-11-22 (decisão D8, ADR-0030). O CKAN do Tesouro registra 'License not specified' para a lista de municípios do SIAFI. Base: Decreto nº 8.777/2016, como em cgu-dados-abertos."

