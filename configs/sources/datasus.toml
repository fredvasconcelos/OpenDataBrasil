# Fontes do Ministério da Saúde: transferência de arquivos do DATASUS (FTP oficial).
#
# Espelho completo do SIM e do SINASC na Bronze (decisão do mantenedor em 2026-11-11:
# guardar toda a informação, porque a fonte pode sair do ar). Um dataset por pasta
# do FTP, com todos os arquivos: microdados .dbc, definições do TabWin, tabelas
# auxiliares e documentação. Tamanhos medidos em 2026-11-11: SIM ~6,6 GB e
# SINASC ~11 GB (docs/data_catalog/datasus-avaliacao.md).
#
# Os .dbc trazem registros individuais: ficam só na Bronze. A Silver guarda
# agregados por município (unidade mínima do projeto); nada individual é publicado (§23).

config_version = "1.0.0"

[institution]
id = "ms"
name = "Ministério da Saúde"
acronym = "MS"
url = "https://www.gov.br/saude"

[[licenses]]
id = "ms-dados-abertos-cc-by"
name = "Creative Commons Atribuição (dados abertos do Ministério da Saúde)"
url = "http://www.opendefinition.org/licenses/cc-by"
conditions = "Reuso permitido com atribuição ao Ministério da Saúde / DATASUS."
review_status = "requires_review"
notes = "Metadado oficial do conjunto SIM em dadosabertos.saude.gov.br/dataset/sim: license_id 'cc-by' (Creative Commons Atribuição), verificado em 2026-11-11. A página de acesso à informação do DATASUS não traz termo de reúso; o rodapé do portal (CC BY-ND 3.0) vale para o conteúdo do site. Confirmar a extensão da licença aos arquivos do FTP antes da publicação pública (§23)."

[[sources]]
id = "datasus-ftp"
name = "DATASUS: transferência de arquivos (FTP)"
connector = "ftp_file"
base_url = "ftp://ftp.datasus.gov.br/dissemin/publicos/"
documentation_url = "https://datasus.saude.gov.br/transferencia-de-arquivos/"

[sources.http]
min_interval_s = 1.0
timeout_s = 300.0
connect_timeout_s = 30.0
max_attempts = 5
backoff_initial_s = 5.0

[[datasets]]
id = "datasus-sim-cid10-dores"
source = "datasus-ftp"
official_id = "SIM/CID10/DORES"
title = "SIM: declarações de óbito por UF de residência (CID-10, 1996 em diante)"
description = "Espelho da pasta SIM/CID10/DORES do FTP do DATASUS: todos os arquivos, sem alteração."
license = "ms-dados-abertos-cc-by"
access_classification = "restricted"
periodicity = "anual, com revisões"
reference_url = "https://datasus.saude.gov.br/transferencia-de-arquivos/"

[datasets.params]
directory = "SIM/CID10/DORES"
pattern = "DO[A-Z]{2}(?P<period>\\d{4})\\.(?:dbc|DBC)"
min_files = 800

[datasets.silver]
# Agregados por município de residência x ano: Total e cada dimensão (ADR-0011).
transformer = "datasus_sim_do"
territorial_reference = "ibge-dtb"
table_id = "SIM-DORES"

