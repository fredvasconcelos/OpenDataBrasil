# Cobertura do Sinesp VDE: períodos que os gestores estaduais declaram INDISPONÍVEIS.
#
# Aprovada pelo mantenedor em 2026-11-12 (ADR-0012, decisão 6). A planilha oficial publica
# 0 nesses meses, mas as notas metodológicas dizem que o dado não existe (sistema antigo
# sem a natureza, migração de sistema, base criada depois). A Silver marca esses meses
# como "não disponível" nas linhas estaduais; a parte federal (PF/PRF), quando houver,
# não muda. O valor publicado continua preservado na Bronze.
#
# Fonte: página "Base de Dados e Notas Metodológicas dos Gestores Estaduais - Sinesp VDE"
# (Bronze: mjsp-sinesp-vde), lida em 2026-11-12. Só entram períodos declarados
# indisponíveis; coberturas parciais (região metropolitana, capital) e mudanças de
# metodologia ficam como notas dos KPIs, não aqui.
#
# Campos: uf (sigla), events (nomes exatos da planilha), start e end (AAAAMM, inclusive).

