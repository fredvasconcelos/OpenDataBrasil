# Fontes do Ministério da Justiça e Segurança Pública (MJSP): estatísticas de segurança pública.
#
# Avaliação e decisões: ADR-0012 e docs/data_catalog/seguranca-publica-avaliacao.md.
# Páginas de origem (verificadas em 2026-11-12):
#   * Sinesp VDE, base de dados e notas metodológicas dos gestores estaduais (2015-2026);
#   * Pesquisa Perfil das Instituições de Segurança Pública (bases de pesquisas anteriores;
#     os links "Base de dados" e "Relatório 2022" da página principal respondem 404);
#   * Mapa da Segurança Pública (publicações em PDF, sem base estruturada).
#
# Tudo vai para a Bronze (preservação). Só o Sinesp VDE tem Silver: os PDFs e as bases
# da Pesquisa Perfil ficam como documentação e insumo de avaliação futura.
# Licenças (ADR-0012, decisão 4, revista em 2026-11-12 com o mantenedor):
#   * dados do Sinesp VDE: dados abertos da Política de Dados Abertos (Decreto 8.777/2016,
#     IN nº 47/2025) e do Plano de Dados Abertos do MJSP 2024-2026 (Portaria MJSP nº 842/2025):
#     uso livre, exigindo no máximo o crédito da fonte (`mjsp-dados-abertos`, aprovada);
#   * publicações e páginas (Mapa em PDF, notas): conteúdo do portal, CC BY-ND 3.0;
#   * Pesquisa Perfil: não consta do PDA; segue em revisão.
#
# O servidor recusa HEAD (403), mas responde ao GET normal: o conector usa só GET.

config_version = "1.0.0"

[institution]
id = "mjsp"
name = "Ministério da Justiça e Segurança Pública"
acronym = "MJSP"
url = "https://www.gov.br/mj"

[[licenses]]
id = "mjsp-dados-abertos"
name = "Dados abertos do MJSP (Política de Dados Abertos do Poder Executivo Federal)"
url = "https://www.gov.br/mj/pt-br/acesso-a-informacao/dados-abertos/legislacao-1"
conditions = "Uso, reúso e redistribuição livres por qualquer pessoa; exige-se no máximo creditar a autoria ou a fonte (MJSP/Senasp, Sinesp)."
review_status = "approved"
notes = "Aprovada pelo mantenedor em 2026-11-12. Base legal: Decreto nº 8.777/2016 (Política de Dados Abertos); IN nº 47/2025 (INDA), art. com as definições de 'dados abertos' e 'licença aberta' ('sujeito, no máximo, a exigência de creditar a sua autoria ou fonte'); Portaria MJSP nº 842/2025 (DOU 16/01/2025), que aprova o Plano de Dados Abertos 2024-2026. O PDA lista 'Dados Ocorrências Criminais – Sinesp' (Senasp) entre as bases abertas (p. 27) e no inventário (item 76, abertura 'não se aplica': já aberta). O PDF do PDA está preservado na Bronze (mjsp-pda-2024-2026)."

[[licenses]]
id = "mjsp-portal-cc-by-nd"
name = "Creative Commons Atribuição-SemDerivações 3.0 Não Adaptada (rodapé do portal gov.br/mj)"
url = "https://creativecommons.org/licenses/by-nd/3.0/deed.pt_BR"
conditions = "Reuso com atribuição ao MJSP; a cláusula SemDerivações proíbe obras derivadas, se valer para os dados."
review_status = "requires_review"
notes = "Vale para o conteúdo editorial do portal (publicações em PDF, páginas). Para os dados do Sinesp VDE, ver mjsp-dados-abertos. Rodapé 'Todo o conteúdo deste site está publicado sob a licença Creative Commons Atribuição-SemDerivações 3.0 Não Adaptada'. Não há termo específico para as bases do Sinesp; o portal de dados do MJ (dados.mj.gov.br) não resolve mais. Confirmar com o MJSP (ou no dados.gov.br) se os dados estatísticos têm licença aberta própria antes de qualquer publicação ou agregação pública (ADR-0012)."

[[sources]]
id = "mjsp-estatistica"
name = "MJSP: estatísticas de segurança pública (downloads do portal gov.br)"
connector = "http_file"
base_url = "https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica"
documentation_url = "https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica/dados-nacionais-1/base-de-dados-e-notas-metodologicas-dos-gestores-estaduais-sinesp-vde-2022-e-2023"

[sources.http]
min_interval_s = 3.0
timeout_s = 300.0
max_attempts = 5
backoff_initial_s = 5.0

# ------------------------------------------------------------------ Sinesp VDE

[[datasets]]
id = "mjsp-sinesp-vde-2015"
source = "mjsp-estatistica"
official_id = "bancovde-2015"
title = "Sinesp VDE: base de dados 2015"
description = "Ocorrências, vítimas e apreensões por UF, município, evento e mês (2015), informadas pelos gestores estaduais e pelas polícias federais no Validador de Dados Estatísticos."
license = "mjsp-dados-abertos"
access_classification = "public_authorized"
periodicity = "mensal, publicada por ano, com revisões"
reference_url = "https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica/dados-nacionais-1/base-de-dados-e-notas-metodologicas-dos-gestores-estaduais-sinesp-vde-2022-e-2023"

[datasets.params]
url = "https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica/download/dnsp-base-de-dados/bancovde-2015.xlsx/@@download/file"
artifact_name = "bancovde-2015.xlsx"
reference_period = "2015"
format = "xlsx"
min_bytes = 1000000
max_bytes = 157286400

[datasets.silver]
# Município x evento x mês: Total e cada dimensão, sem cruzamento (ADR-0012).
transformer = "sinesp_vde"
territorial_reference = "ibge-dtb"
table_id = "SINESP-VDE"
# Membro da série lida pela Gold (configs/indicators/demografia/seguranca_sinesp.toml).
series = "mjsp-sinesp-vde"
# Períodos declarados indisponíveis pelos gestores (ADR-0012, decisão 6), relativo a configs/sources.
coverage_file = "coverage/sinesp_vde.toml"

[datasets.silver.aliases]
# Grafias da fonte → código da DTB (correspondência única conferida na DTB 2025, 2026-11-12).
"MG/BARÃO DE MONTE ALTO" = "3105509"       # Barão do Monte Alto
"MT/SANTO ANTÔNIO DO LEVERGER" = "5107800" # Santo Antônio de Leverger
"RN/ARÊS" = "2401206"                      # Arez
"RN/AÇU" = "2400208"                       # Assú
"RR/SÃO LUIZ" = "1400605"                  # São Luiz do Anauá (nome anterior)
"SE/GRACHO CARDOSO" = "2802601"            # Graccho Cardoso

