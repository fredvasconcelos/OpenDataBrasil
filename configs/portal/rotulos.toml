# Rótulos curtos do portal (DS 2.3.11, princípio 80/20).
#
# A fonte publica nomes longos de classificações e categorias. O portal mostra o rótulo
# curto em "Detalhar por", nas colunas da tabela, na série e no tooltip. O nome
# completo fica no botão de informação da tabela (ⓘ), no título (hover) e nas
# exportações, que guardam sempre o nome oficial.
#
# Chaves:
# - [dimensoes]: código da classificação no portal ("c1821"). Uma classificação própria
#   de tabela ("c653t4423", ADR-0014) usa o rótulo da origem ("c653") se não tiver o seu.
# - [categorias]: chave exata da categoria ("c1821:72144", "c67t6736:4661").
#
# Regra de escrita: até ~35 caracteres, sem perder o que distingue as categorias entre
# si; o termo da classificação vai na frente quando várias categorias o repetem
# ("Rede geral: outra forma").

