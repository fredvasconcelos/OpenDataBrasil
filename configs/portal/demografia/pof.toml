# KPIs curados da POF. A despesa média (série 2002, 2008 e 2018 das tabelas 2309,
# 1594 e 6715) liga ao item do panorama pelo id (ligação implícita, ADR-0010). As
# POF de 1987 e 1995 (tabelas 387, 400, 414 e 417, ADR-0016) têm ligação explícita.

config_version = "1.0.0"
scope = "demografia"
dimension_order = ["c201", "c210", "c210alim", "c214", "c215"]

[[themes]]
id = "consumo_familias"
label = "Consumo e orçamentos familiares"

[[themes.subthemes]]
id = "despesas_rendimentos"
label = "Despesas e rendimentos das famílias"

[[themes.subthemes.kpis]]
id = "despesa_familiar"
label = "Despesa média mensal familiar"
indicator = "despesa_familiar"
# Correção pelo IPCA (ADR-0020): "Corrigir por" no portal. Meses de referência das POF.
corrections = [
    { id = "ipca", label = "IPCA geral", indicator = "ipca_grupos_variacao_mensal", reference_months = { "2002" = "2003M01", "2008" = "2009M01", "2018" = "2018M01" }, note = "Método (ADR-0020): valor × I(mês-base) ÷ I(mês de referência da edição), com I o número-índice encadeado das variações mensais do IPCA (tabelas 655, 2938, 1419 e 7060). Mês de referência de cada POF: jan/2003 (2002-2003), jan/2009 (2008-2009) e jan/2018 (2017-2018); a data oficial é o dia 15, e o IPCA é mensal. O mês-base é o da edição mais recente e avança sozinho quando uma POF nova entrar. Todas as categorias usam o índice geral do IPCA." },
    { id = "ipca_grupo", label = "IPCA por grupo de despesa", indicator = "ipca_grupos_variacao_mensal", reference_months = { "2002" = "2003M01", "2008" = "2009M01", "2018" = "2018M01" }, dimension = "c12190", groups = { "103539" = "7170", "103540" = "7445", "8017" = "7445", "8019" = "7786", "8020" = "7786", "8021" = "7786", "8024" = "7486", "8025" = "7486", "8026" = "7486", "111442" = "7486", "8027" = "7486", "103554" = "7558", "103561" = "7625", "103569" = "7660", "103574" = "7660", "103585" = "7766", "103592" = "7712", "103598" = "7712", "103599" = "7712", "103604" = "7712" }, note = "Método (ADR-0020): valor × I(mês-base) ÷ I(mês de referência da edição), com I o número-índice encadeado das variações mensais do IPCA (tabelas 655, 2938, 1419 e 7060). Mês de referência de cada POF: jan/2003 (2002-2003), jan/2009 (2008-2009) e jan/2018 (2017-2018); a data oficial é o dia 15, e o IPCA é mensal. O mês-base é o da edição mais recente e avança sozinho quando uma POF nova entrar. Cada tipo de despesa usa o grupo do IPCA correspondente (alimentação → Alimentação e bebidas; habitação → Habitação; telefone e internet → Comunicação; móveis, eletrodomésticos e limpeza → Artigos de residência; vestuário → Vestuário; transporte → Transportes; higiene e saúde → Saúde e cuidados pessoais; educação → Educação; recreação, fumo, serviços pessoais e despesas diversas → Despesas pessoais). Subitens herdam o grupo do item acima. Totais, subtotais e despesas fora do consumo (impostos, aumento do ativo, diminuição do passivo) usam o índice geral; por isso a soma dos itens corrigidos pode diferir do total corrigido." },
]
dimensions = [
    { classification = "c339", partition = "classes_rendimento", label = "Classes de rendimento" },
    { classification = "c12190", partition = "d2_1_despesas_de_consumo", label = "Despesas de consumo" },
]

[[themes.subthemes.kpis]]
id = "pof_despesa_distribuicao_antiga"
label = "Distribuição da despesa familiar (POF 1987 e 1995)"
indicator = "pof_despesa_distribuicao_antiga"
# Sem mapa: na malha municipal, só Brasília e Goiânia teriam cor.
map_levels = []
dimensions = [
    { classification = "c201", partition = "classes_recebimento_sm", label = "Classes de recebimento" },
    { classification = "c210", partition = "tipos_despesa_pof_antiga", label = "Tipos de despesa" },
]

[[themes.subthemes.kpis]]
