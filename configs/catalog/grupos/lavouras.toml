# Grupos de produtos das lavouras (pedido do mantenedor, 2026-11-13).
#
# A PAM (SIDRA 5457) publica 85 produtos sem agrupamento. Os grupos seguem fontes
# oficiais:
# - Grãos: o grupo "Cereais, leguminosas e oleaginosas" do LSPA/IBGE (descritor da
#   tabela 6588, classificação c48, 2026-11-13) e os 15 produtos da Safra de Grãos da
#   Conab (https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/safras/
#   safra-de-graos, 2026-11-13). Ervilha, fava e linho não são acompanhados pelo LSPA,
#   mas são leguminosas e oleaginosas em grão: entram pela definição do grupo.
# - Demais grupos: classes da CNAE 2.0 (IBGE/Concla), seção A, divisão 01: 01.13 cana,
#   01.14 fumo, 01.12 e 01.39 fibras, 01.21 horticultura, 01.31 a 01.33 frutas,
#   01.34 café, 01.35 cacau, 01.39 chá, mate e guaraná. Raízes e tubérculos
#   (mandioca, batatas, inhame) reúnem as classes de lavoura temporária desses produtos.
#
# O grupo é a soma dos produtos (só em variáveis somáveis entre produtos: área e valor
# da produção; a quantidade tem unidades diferentes, como mil frutos no abacaxi e no
# coco). "Café (em grão) Total" já contém o arábica e o canephora: eles aparecem como
# subitens, sem entrar na soma.

classification = "c782"

[[grupos]]
id = "g_graos"
nome = "Grãos (cereais, leguminosas e oleaginosas)"
fonte = "LSPA/IBGE (tabela 6588, grupo 1) e Conab, Safra de Grãos"
