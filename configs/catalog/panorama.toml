# Panorama do Brasil: taxonomia do portal e KPIs do Tier 1 (ADR-0010).
#
# Pergunta que o Tier 1 responde: "qual é o panorama geral do país?".
# Regra de escolha (decisão do mantenedor, 2026-11-10):
#   * a tabela-base é a de MENOR detalhe da família (ex.: 417 e não 418/419);
#   * o KPI é o valor do Total; a dimensão principal entra pelas suas
#     categorias como percentual do Total; as demais dimensões ficam no Total;
#   * as variantes da mesma família com uma única dimensão viram FILTROS;
#   * cruzamentos, recortes especiais (MDA, PRONAF, FAO, tipologia) e séries
#     encerradas ou experimentais com substituta ficam de fora.
#
# Filtros: território e período valem para todos os temas. Os demais são
# por tema (uma tabela de agropecuária não tem cor ou raça).
#
# `tabela` é o código oficial do SIDRA, conferido contra o snapshot do acervo
# (configs/catalog/sidra_acervo_2026-11-10.csv). `pesquisa` é inferida do
# título e fica a confirmar pelos exports por pesquisa do acervo.
# `kpi` liga o item a um KPI curado do portal (configs/portal/*.toml). Sem `kpi`,
# o item está publicado se o portal tem um KPI com o mesmo id (os KPIs de Total
# gerados por `odb panorama gerar`); senão, aparece como "em preparação".
# `variavel` fixa a variável SIDRA do KPI quando a regra do gerador não serve.
# `requer_categoria = true` marca KPIs cujo Total é só o universo da tabela
# (por exemplo, o número de municípios): esperam a onda das categorias.
# Metadados verificados na API ficam em panorama_verificacao.json
# (`odb panorama verificar`) e os descritores oficiais das tabelas, em
# descritores/ (`odb panorama descrever`, ADR-0010, decisão 7).

config_version = "1.0.0"
acervo = "sidra_acervo_2026-11-10.csv"
acervo_sha256 = "a9ec32ee30cf69c19f532e3a2b8d8b0f08384f2fc6509d7ad4d1cf8325b97c5c"
acervo_obtido_em = "2026-11-10"
acervo_origem = "https://sidra.ibge.gov.br/acervo (exportação 'Salvar TSV' do acervo completo, feita pelo mantenedor no navegador)"

