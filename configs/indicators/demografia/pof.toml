note = "As faixas mudam a cada edição da POF: em 2008 e 2018, até 2, de 2 a 3, de 3 a 6, de 6 a 10, de 10 a 15, de 15 a 25 e mais de 25 SM (SM de R$ 954 na POF 2017-2018 e de R$ 415 na 2008-2009). Em 2002, as 10 faixas (até R$ 400 a mais de R$ 6.000) são da classificação de rendimento monetário e não monetário (tabela 2309), outro conceito: não incluem a variação patrimonial. A despesa média do Total não é a soma das médias das classes."

