[[facts]]
id = "fact_pof_household_expense"
dataset = "ibge-pof-despesa-familiar"
grain = "território (Brasil, Grande Região, UF) x ano de referência da POF x classe de rendimento x tipo de despesa"
description = "Despesa monetária e não monetária média mensal familiar e sua distribuição, por classe de rendimento e tipo de despesa (POF 2002-2003, 2008-2009 e 2017-2018)."
classifications = { "c339" = "income_class_category_key", "c12190" = "expense_type_category_key" }

# POF 2002-2003: situação do domicílio e classe de rendimento próprias, só no Total;
# a c339 não existe na tabela, e o valor (de todas as famílias) entra no Total dela.
[facts.table_rules.2309]
fixed_categories = { "Situação do domicílio" = "6795" }
# Faixas de 2002 (c12191, rendimento monetário e não monetário) como "Classes de
# rendimento" do fato, com categorias próprias; o Total vira o da c339.
rename_dimensions = { "Classes de rendimento monetário e não monetário mensal familiar" = "Classes de rendimento total e variação patrimonial mensal familiar" }

# Tipos de despesa de 2002 com código próprio → equivalentes de 2008 e 2018 (nome e
# posição na árvore; as renomeadas são aproximadas e estão nas notas).
[facts.table_rules.2309.recode_categories]
"Classes de rendimento total e variação patrimonial mensal familiar" = { "103411" = "7999" }
"Tipos de despesa" = { "103542" = "8017", "103543" = "8018", "103544" = "8019", "103545" = "8020", "103546" = "8022", "103547" = "8010", "103548" = "8023", "103549" = "8024", "103550" = "8025", "103551" = "8026", "103552" = "111442", "103553" = "8027", "103565" = "8011", "103567" = "8012", "103579" = "8013", "103588" = "8014", "103595" = "8015", "103596" = "8016" }

[[indicators]]
id = "despesa_familiar"
name = "Despesa monetária e não monetária média mensal familiar"
description = "Despesa média mensal das famílias, monetária e não monetária, nas POF 2002-2003, 2008-2009 e 2017-2018, por classe de rendimento e tipo de despesa."
dataset = "ibge-pof-despesa-familiar"
variable = "1201"
fact = "fact_pof_household_expense"
column = "average_expense"
unit = "Reais"
additivity = "non_additive"
concept = "despesa_media_familiar"
path = ["Consumo e orçamentos familiares", "Despesas e rendimentos das famílias"]
caveats = [
    "Valor médio por família: médias de regiões ou de classes de rendimento não se somam.",
    "Três edições: 2002 (POF 2002-2003), 2008 (POF 2008-2009) e 2018 (POF 2017-2018). Os valores estão em reais da data de referência de cada pesquisa, sem correção pela inflação: a comparação entre edições é nominal.",
    "A POF 2002-2003 só tem Brasil e Grandes Regiões; as UFs começam em 2008.",
    "Classes de rendimento: em 2008 e 2018, 7 faixas que equivalem às mesmas faixas de salário mínimo (2 a 25 SM); em 2002, 10 faixas da classificação de rendimento monetário e não monetário (tabela 2309), outro conceito, sem a variação patrimonial. Decisão do mantenedor (2026-11-13): as faixas de 2002 entram como 'Classes de rendimento' com essa ressalva, e cada edição mostra só as suas.",
    "Tipos de despesa harmonizados (decisão do mantenedor, 2026-11-13): 18 categorias de 2002 com código próprio passam aos códigos equivalentes de 2008 e 2018, pelo nome e pela posição na árvore. Iguais no nome: serviços e taxas, energia elétrica, telefone fixo e celular, gás doméstico, água e esgoto, outros, manutenção do lar, artigos de limpeza, mobiliários e artigos do lar, eletrodomésticos, consertos de artigos do lar. Renomeadas, com equivalência aproximada (o conteúdo pode ter mudado): manutenção de veículo próprio → manutenção e acessórios; viagens → viagens esporádicas; tratamento ambulatorial → tratamento médico e ambulatorial; outros cursos → outros cursos e atividades; periódicos, livros e revistas → não didáticos; diversões e esportes → recreações e esportes. As notas das tabelas 2309, 1594 e 6715 não tratam da comparabilidade entre edições.",
]

[[indicators]]
id = "despesa_familiar_distribuicao"
name = "Distribuição da despesa monetária e não monetária média mensal familiar"
description = "Participação de cada tipo de despesa na despesa total média mensal das famílias (POF 2002-2003, 2008-2009 e 2017-2018)."
dataset = "ibge-pof-despesa-familiar"
variable = "1204"
fact = "fact_pof_household_expense"
column = "expense_share_pct"
unit = "%"
additivity = "non_additive"
concept = "distribuicao_despesa_familiar"
path = ["Consumo e orçamentos familiares", "Despesas e rendimentos das famílias"]
caveats = [
    "Três edições: 2002 (POF 2002-2003), 2008 (POF 2008-2009) e 2018 (POF 2017-2018). A POF 2002-2003 só tem Brasil e Grandes Regiões.",
    "Classes de rendimento só em 2008 e 2018, com faixas diferentes em reais (as mesmas em salários mínimos). Em 2002, só o Total.",
    "Alguns tipos de despesa mudaram entre 2002 e 2008: os de 2002 com código próprio só têm valor em 2002.",
]
