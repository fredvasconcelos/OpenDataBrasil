exhaustive = false
note = "As faixas mudam a cada edição da POF: em salários mínimos, são até 2, de 2 a 3, de 3 a 6, de 6 a 10, de 10 a 15, de 15 a 25 e mais de 25 SM (SM de R$ 954 na POF 2017-2018 e de R$ 415 na 2008-2009). A POF 2002-2003 usa outro conceito de rendimento e só entra no Total. A despesa média do Total não é a soma das médias das classes."

