# POF: despesa média mensal familiar em três edições (ADR-0016), em série:
# 2002-2003 (SIDRA 2309), 2008-2009 (1594) e 2017-2018 (6715), completas.
#
# Curado à mão a partir dos descritores oficiais
# (https://apisidra.ibge.gov.br/DescritoresTabela/t/<tabela>, gravados em
# configs/catalog/descritores/t2309.json, t1594.json e t6715.json).
# - Tipos de despesa (c12190): 2008 e 2018 têm as mesmas 93 categorias (mesmos
#   códigos). 2002 tem 89: 71 com os mesmos códigos e 18 próprias (habitação,
#   transporte, saúde, educação e recreação foram reorganizados); as próprias
#   entram como irmãs nas partições e só têm valor em 2002.
# - Classes de rendimento (c339): só 2008 e 2018. As faixas mudam de valor a cada
#   edição, mas são as mesmas em salários mínimos (2, 3, 6, 10, 15 e 25 SM; SM de
#   R$ 415 em 2008 e de R$ 954 em 2018). A 2309 usa outro conceito (rendimento
#   monetário e não monetário, c12191, 10 faixas): 2002 entra só no Total.
#
# A árvore dos tipos de despesa segue
# a indentação oficial (NivelIdentacao): cada partição reúne os filhos diretos
# de uma categoria. O descritor informa que as categorias das duas
# classificações não podem ser somadas (CategoriasPodemSerSomadas = false):
# as partições são não exaustivas e os indicadores, não aditivos (médias).

config_version = "1.0.0"
