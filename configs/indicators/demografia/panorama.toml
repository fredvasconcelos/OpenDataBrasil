name = "Quantidade de ovos produzidos"
description = "Quantidade de ovos produzidos (Produção de Ovos de Galinha, tabela SIDRA 7524). Recorte: Referência temporal: Total do trimestre. Fonte: IBGE - Produção de Ovos de Galinha."
dataset = "ibge-sidra-7524"
variable = "29"
fact = "fact_sidra_7524"
column = "valor"
unit = "Mil dúzias"
additivity = "additive"
concept = "ovos_produzidos"
path = ["Agropecuária", "Pecuária e produção animal"]
caveats = ["Nota da tabela 7524: 1 - Até o 4º trimestre de 2011: As informações não correspondem às produções totais das Unidades da Federação, uma vez que são pesquisados apenas os estabelecimentos com 10.000 ou mais galinhas poedeiras.", "Nota da tabela 7524: 2 - A partir do 1º trimestre de 2012: As informações não correspondem às produções totais das Unidades da Federação, uma vez que são pesquisados apenas os estabelecimentos com capacidade de alojamento de pelo menos 10.000 galinhas poedeiras.", "Nota da tabela 7524: 3 - O número de galinhas poedeiras refere-se à média do plantel existente no último dia de cada mês do trimestre.", "Nota da tabela 7524: 4 - O número de informantes se repete nos meses de cada trimestre devido à periodicidade de coleta da pesquisa ser trimestral.", "Nota da tabela 7524: 5 - Até o 4º trimestre de 2005 os dados das Unidades da Federação com menos de 4 (quatro) informantes estão desidentificados com o caracter X. A partir do 1º trimestre de 2006 a desidentificação passou a ser feita para menos de 3 (três) informantes.", "Nota da tabela 7524: 6 - Os dados dos 4 trimestres do ano são preliminares até a divulgação dos dados do 1° trimestre do ano seguinte."]

