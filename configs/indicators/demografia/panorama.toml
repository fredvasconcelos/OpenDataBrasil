caveats = ["Nota da tabela 6588: 1 - Para as Unidades da Federação que, por força do calendário agrícola, ainda não dispõem das estimativas iniciais, os dados correspondem a uma projeção obtida a partir das informações de anos anteriores;", "Nota da tabela 6588: 2 - As produções de abacaxi e de coco-da-baía são expressas em mil frutos e os seus rendimentos médios em frutos/ha.", "Nota da tabela 6588: 3 - Utilizou-se a padronização de 61% para a conversão da produção do algodão em caroço para caroço de algodão, apenas para a totalização da produção dos cereais, leguminosas e oleaginosas.", "Nota da tabela 6588: 4 - Possíveis diferenças entre somas de parcelas e respectivos totais são provenientes do critério de arredondamento.", "Nota da tabela 6588: 5 - As informações mensais que compõem a série histórica estão disponível a partir de setembro de 2006.", "Nota da tabela 6588: 6 - A partir de janeiro de 2018 foram retirados da divulgação os seguintes produtos: abacaxi, alho, cebola, coco-da-baía, guaraná, maçã, malva, pimenta-do-reino, sisal/agave. Os mesmos continuam sendo acompanhados na pesquisa anual da Produção Agrícola Municipal."]

