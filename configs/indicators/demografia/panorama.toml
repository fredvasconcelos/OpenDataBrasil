caveats = ["Nota da tabela 5606: A partir do 4º trimestre de 2015, em acordo com as recomendações da 19ª Conferência Internacional de Estatísticos do Trabalho - CIET, da OIT, pessoas em licença remunerada, independentemente do tempo de afastamento, passaram a ser classificadas como \"ocupadas\" e seus rendimentos do trabalho foram coletados normalmente. Anteriormente, as pessoas em licença remunerada na semana de referência da pesquisa e que estavam afastadas por período inferior a 4 meses eram classificadas como \"ocupadas\". Caso esse afastamento fosse igual ou superior a 4 meses, essas pessoas eram definidas como \"fora da força de trabalho\" e, portanto, não se investigava o rendimento do trabalho.", "Nota da tabela 5606: Além disso, a partir do 4º trimestre de 2015, também passaram a ser classificadas como \"ocupadas\" as pessoas que ajudaram, sem receber remuneração, no trabalho remunerado de parente, adicionalmente àquelas que ajudaram no trabalho remunerado de outro morador do mesmo domicílio. Anteriormente, eram consideradas \"ocupadas\" apenas as pessoas que ajudaram, sem receber remuneração, no trabalho remunerado de outro morador do mesmo domicílio.", "Nota da tabela 5606: O valor efetivo se refere ao valor recebido no mês anterior ao da coleta.", "Nota da tabela 5606: Para cálculo do valor real é utilizado o deflator da média do último trimestre de coleta divulgado, conforme a Nota Técnica (maio/2015 - atualizada em 16/10/2018).", "Nota da tabela 5606: A partir de 15 de agosto de 2025, as estimativas deste tema passaram a ser divulgadas com base na nova ponderação da pesquisa, conforme a Nota Técnica 02/2025. Consequentemente, a série histórica dos indicadores foi atualizada."]

