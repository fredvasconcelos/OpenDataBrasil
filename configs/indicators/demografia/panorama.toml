fact = "fact_sidra_5457"
column = "valor"
unit = "Hectares"
additivity = "additive"
concept = "producao_lavouras"
path = ["Agropecuária", "Lavouras"]
caveats = ["Nota da tabela 5457: 1 - Os municípios sem informação para pelo menos um produto da lavoura não aparecem nas listas;", "Nota da tabela 5457: 2 - A partir do ano de 2001 as quantidades produzidas dos produtos abacate, banana, caqui, figo, goiaba, laranja, limão, maçã, mamão, manga, maracujá, marmelo, melancia, melão, pera, pêssego e tangerina passam a ser expressas em toneladas. Nos anos anteriores eram expressas em mil frutos, com exceção da banana, que era expressa em mil cachos. O rendimento médio passa a ser expresso em Kg/ha. Nos anos anteriores era expresso em frutos/ha, com exceção da banana, que era expressa em cachos/ha.", "Nota da tabela 5457: 3 - Veja em https://sidra.ibge.gov.br/content/documentos/pam/AlteracoesUnidadesMedidaFrutas.pdf um documento com as alterações de unidades de medida das frutíferas ocorridas em 2001 e a tabela de conversão fruto x quilograma.", "Nota da tabela 5457: 4 - Até 2001, café (em coco), a partir de 2002, café (beneficiado ou em grão).", "Nota da tabela 5457: 5 - Os produtos girassol e triticale só apresentam informação a partir de 2005.", "Nota da tabela 5457: 6 - As quantidades produzidas de abacaxi e de coco-da-baía são expressas em mil frutos e o rendimento médio em frutos/ha.", "Nota da tabela 5457: 7 - Valores para a categoria Total indisponíveis para as variáveis Quantidade produzida e Rendimento médio, pois as unidades de medida diferem para determinados produtos.", "Nota da tabela 5457: 8 - Subentende a possibilidade de cultivos sucessivos ou simultâneos (simples, associados e/ou intercalados) no mesmo ano e no mesmo local, podendo, por isto, a área informada da cultura exceder a área geográfica do município.", "Mais 6 notas na tabela oficial (SIDRA 5457)."]

