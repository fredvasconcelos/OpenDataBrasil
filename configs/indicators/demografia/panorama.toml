[[indicators]]
id = "producao_lavouras"
name = "Área plantada ou destinada à colheita"
description = "Área plantada ou destinada à colheita (Produção Agrícola Municipal, tabela SIDRA 5457). Valores no Total: Produto das lavouras temporárias e permanentes: Total. Fonte: IBGE - Produção Agrícola Municipal."
