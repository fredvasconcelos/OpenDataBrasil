# POF 1987-1988 e 1995-1996 (ADR-0016, opção A do mantenedor em 2026-11-12):
# tabelas SIDRA 387 (distribuição da despesa), 400 (despesa com alimentação),
# 414 (recebimento) e 417 (aquisição alimentar per capita, que também tem 2002 e
# 2008).
#
# As pesquisas cobriam só as regiões metropolitanas de Belém, Fortaleza, Recife,
# Salvador, Belo Horizonte, Rio de Janeiro, São Paulo, Curitiba e Porto Alegre,
# Brasília e Goiânia ("Total das áreas"). Não há nível Brasil nem UF, e os
# valores das tabelas 387, 400 e 414 são só percentuais. Por isso ficam numa série
# separada da POF nacional (2002 em diante).
#
# Curado a partir dos descritores oficiais (configs/catalog/descritores/t387.json,
# t400.json, t414.json e t417.json). Os tipos de despesa e as origens do recebimento
# não têm hierarquia no descritor (todos no mesmo nível): ficam numa partição única,
# sem inventar a árvore. A 400 tem raiz própria ("Despesa em alimentação") e usa a
# classificação c210alim (ADR-0014), com o mesmo rótulo.

