[[indicators]]
id = "pof_despesa_distribuicao_antiga"
name = "Percentual da despesa média mensal familiar"
description = "Distribuição da despesa média mensal familiar por tipo de despesa e classe de recebimento (POF 1987-1988 e 1995-1996)."
dataset = "ibge-sidra-387"
variable = "172"
fact = "fact_pof_old_expense_share"
column = "expense_share_pct"
unit = "%"
additivity = "non_additive"
concept = "pof_despesa_distribuicao_antiga"
path = ["Consumo e orçamentos familiares", "Despesas e rendimentos das famílias"]
caveats = ["O que se mostra: o percentual de cada tipo de despesa na despesa média mensal familiar (Desembolso global = 100%), e não valores em moeda. Ex.: em Belém, em 1995, despesas correntes = 88,68% e despesas de consumo = 79,44% do desembolso global. Subtotais e itens aparecem lado a lado, como na tabela original, por isso a soma das linhas passa de 100%.", "Só as áreas da pesquisa: 9 regiões metropolitanas (Belém, Fortaleza, Recife, Salvador, Belo Horizonte, Rio de Janeiro, São Paulo, Curitiba e Porto Alegre), Brasília e Goiânia, e o Total das áreas. Não há Brasil nem UF.", "Períodos: 1987, 1995 (anos de referência das pesquisas).", "Só percentuais: a tabela não publica os valores em moeda. Os de 1987 seriam em cruzados.", "Não comparável diretamente com a POF nacional (2002 em diante): outra cobertura, outros tipos de despesa e classes em salários mínimos.", "Nota da tabela 387: 1) Em 1987 o valor do piso salarial era cz$ 2.640,00, e em 1996 o salário mínimo correspondia a R$ 112,00.", "Nota da tabela 387: 2) Na classe de recebimento até 2 estão incluídas as famílias sem recebimento.", "Divergência entre fontes: a planilha da POF 1995-1996 no FTP do IBGE (SIDRA387.XLS, de 2016) difere da tabela 387 do SIDRA em décimos (despesas correntes no Total das áreas: 80,96% na planilha, 81,26% no SIDRA; alimentação: 16,39% e 16,61%). A plataforma usa a tabela 387 do SIDRA."]

