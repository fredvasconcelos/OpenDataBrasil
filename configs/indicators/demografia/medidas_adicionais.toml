[[indicators]]
id = "forca_trabalho_v1641"
name = "Pessoas de 14 anos ou mais de idade"
description = "Pessoas de 14 anos ou mais de idade"
dataset = "ibge-medida-t4093-v1641"
variable = "1641"
fact = "fact_medida_t4093_v1641"
column = "valor"
unit = "Mil pessoas"
additivity = "additive"
concept = "forca_trabalho_v1641"
path = ["Trabalho e rendimento", "Ocupação e desocupação"]
caveats = ["Medida nativa da tabela SIDRA 4093, variável 1641, no Total das classificações. Não herda cruzamentos ou detalhamentos de outras tabelas.", "Médias, razões, taxas e limites de confiança mantêm os valores oficiais; não são obtidos pela soma de municípios, UFs ou categorias.", "A partir do 4º trimestre de 2015, em acordo com as recomendações da 19ª Conferência Internacional de Estatísticos do Trabalho - CIET, da OIT, pessoas em licença remunerada, independentemente do tempo de afastamento, passaram a ser classificadas como \"ocupadas\" e seus rendimentos do trabalho foram coletados normalmente. Anteriormente, as pessoas em licença remunerada na semana de referência da pesquisa e que estavam afastadas por período inferior a 4 meses eram classificadas como \"ocupadas\". Caso esse afastamento fosse igual ou superior a 4 meses, essas pessoas eram definidas como \"fora da força de trabalho\" e, portanto, não se investigava o rendimento do trabalho.", "Além disso, a partir do 4º trimestre de 2015, também passaram a ser classificadas como \"ocupadas\" as pessoas que ajudaram, sem receber remuneração, no trabalho remunerado de parente, adicionalmente àquelas que ajudaram no trabalho remunerado de outro morador do mesmo domicílio. Anteriormente, eram consideradas \"ocupadas\" apenas as pessoas que ajudaram, sem receber remuneração, no trabalho remunerado de outro morador do mesmo domicílio.", "A partir de abril de 2016, um aspecto do conceito de desocupação foi alterado de forma a se adequar inteiramente à 19ª Conferência Internacional de Estatísticos do Trabalho - CIET, realizada em outubro de 2013, sendo o questionário ajustado. Com a alteração desse aspecto, passam a ser considerados desocupados aqueles que conseguiram proposta de trabalho para começar após a semana de referência e que iriam começar a trabalhar em até 3 meses; os demais, isto é, aqueles que conseguiram proposta para começar a trabalhar após 3 meses da semana de referência, passam a ser contabilizados na população fora da força de trabalho. Anteriormente, eram considerados desocupados todos aqueles que conseguiram proposta de trabalho para começar após a semana de referência, independentemente do tempo em que iniciariam o trabalho que conseguiram.", "A partir de 15 de agosto de 2025, as estimativas deste tema passaram a ser divulgadas com base na nova ponderação da pesquisa, conforme a Nota Técnica 02/2025. Consequentemente, a série histórica dos indicadores foi atualizada.", "Os níveis territoriais respeitam as interrupções de divulgação do descritor. Períodos sem recorte local não recebem estimativas.", "A cobertura municipal desta pesquisa se restringe às 27 capitais."]

