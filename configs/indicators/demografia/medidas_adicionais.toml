caveats = ["Medida nativa da tabela SIDRA 1092, variável 151, no Total das classificações. Não herda cruzamentos ou detalhamentos de outras tabelas.", "Médias, razões, taxas e limites de confiança mantêm os valores oficiais; não são obtidos pela soma de municípios, UFs ou categorias.", "Pesquisa trimestral de abate: Total do trimestre, do rebanho bovino e da inspeção. Peso em quilogramas. Informantes se repetem nos meses do trimestre e não são somados pela plataforma; sigilo permanece sigilo.", "1 - Os dados divulgados são oriundos de estabelecimentos que estão sob inspeção sanitária federal, estadual ou municipal.", "2 - Os dados das Unidades da Federação com menos de 3 informantes estão desidentificados com o caracter X.", "3 - O número de informantes se repete nos meses de cada trimestre devido à periodicidade de coleta da pesquisa ser trimestral.", "4 - A pesquisa do abate sofreu alterações conceituais a partir de 2012. As categorias de novilhos precoces, vitelos e novilhos foram fundidos em uma só: novilhos. O mesmo vale para novilhas.", "5 - Bovinos - gado doméstico, dividido em categorias conforme sexo e idade:", "Boi - bovino macho adulto, com 2 anos de idade ou mais. Inclui o macho não castrado (touro).", "Vaca - bovino fêmea adulta, com 2 anos de idade ou mais, independente de já ter parido ou não.", "Novilho - bovino macho jovem, com menos de 2 anos de idade. Inclui vitelo, bezerro e novilho (precoce ou não).", "Novilha - bovino fêmea jovem, com menos de 2 anos de idade. Inclui vitela, bezerra e novilha (precoce ou não).", "6 - Peso da Carcaça - peso da carcaça quente (em Kg), entendendo-se como carcaça: o animal abatido, formado das massas musculares e ossos, desprovido de cabeça, mocotós, cauda, couro, órgãos e vísceras torácicas e abdominais, tecnicamente preparado. Nos frangos, é facultativa a retirada dos rins, pés, pescoço e cabeça. Nos suínos a carcaça pode ou não incluir o couro, a cabeça e os pés.", "7 - Os dados dos 4 trimestres do ano são preliminares até a divulgação dos dados do 1° trimestre do ano seguinte."]

