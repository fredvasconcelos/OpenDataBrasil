caveats = ["Medida nativa da tabela SIDRA 7524, variável 1988, no Total das classificações. Não herda cruzamentos ou detalhamentos de outras tabelas.", "Médias, razões, taxas e limites de confiança mantêm os valores oficiais; não são obtidos pela soma de municípios, UFs ou categorias.", "Pesquisa trimestral de ovos: Total do trimestre e da finalidade. O plantel representa a média dos últimos dias dos meses do trimestre, não produção acumulável. Informantes não são somados. A cobertura segue os limiares da nota oficial e não equivale a todos os estabelecimentos da UF.", "1 - Até o 4º trimestre de 2011: As informações não correspondem às produções totais das Unidades da Federação, uma vez que são pesquisados apenas os estabelecimentos com 10.000 ou mais galinhas poedeiras.", "2 - A partir do 1º trimestre de 2012: As informações não correspondem às produções totais das Unidades da Federação, uma vez que são pesquisados apenas os estabelecimentos com capacidade de alojamento de pelo menos 10.000 galinhas poedeiras.", "3 - O número de galinhas poedeiras refere-se à média do plantel existente no último dia de cada mês do trimestre.", "4 - O número de informantes se repete nos meses de cada trimestre devido à periodicidade de coleta da pesquisa ser trimestral.", "5 - Até o 4º trimestre de 2005 os dados das Unidades da Federação com menos de 4 (quatro) informantes estão desidentificados com o caracter X. A partir do 1º trimestre de 2006 a desidentificação passou a ser feita para menos de 3 (três) informantes.", "6 - Os dados dos 4 trimestres do ano são preliminares até a divulgação dos dados do 1° trimestre do ano seguinte."]

