concept = "seguranca_alimentar_v9784"
path = ["Consumo e orçamentos familiares", "Alimentação e segurança alimentar"]
caveats = ["Medida nativa da tabela SIDRA 9552, variável 9784, nas categorias nativas de Situação de segurança alimentar existente no domicílio; demais classificações no Total. Não herda cruzamentos ou detalhamentos de outras tabelas.", "Médias, razões, taxas e limites de confiança mantêm os valores oficiais; não são obtidos pela soma de municípios, UFs ou categorias.", "PNAD Contínua, 2023–2024, com a ponderação atualizada indicada na nota oficial. Categorias de insegurança alimentar incluem um agregado e seus graus: não se somam pais e filhos. A situação do domicílio fica fixa no Total.", "O Total da distribuição é 100% por definição. Em Detalhar por, consulte segurança e insegurança alimentar. Os graus leve, moderado e grave são preservados na Gold e consultáveis pela API estruturada; não são recalculados pela plataforma.", "Considera-se domicílio em situação de insegurança alimentar aquele em que seus moradores, nos últimos três meses, passaram por ao menos uma das seguintes situações: tiveram a preocupação de que os alimentos acabassem antes de poderem comprar ou receber mais comida, lhes faltaram alimentos antes que tivessem dinheiro para comprar mais comida, ficaram sem dinheiro para terem uma alimentação saudável e variada, e comeram apenas alguns poucos tipos de alimentos que ainda tinham por que o dinheiro acabou. A insegurança alimentar pode ser classificada como leve, moderada ou grave, de acordo com a restrição na qualidade e na quantidade de alimentos consumidos pelos moradores.", "A classificação \"Situação do domicílio\" está disponível apenas para os níveis territoriais Brasil e Grande Região.", "A partir de 2025, as estimativas deste tema passaram a ser divulgadas com base na nova ponderação da pesquisa, conforme a Nota Técnica 02/2025. Consequentemente, a série histórica dos indicadores foi atualizada."]

