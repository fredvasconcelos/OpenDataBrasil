name = "Valor do rendimento nominal mediano mensal domiciliar per capita dos moradores em domicílios particulares permanentes ocupados, exclusive os cuja condição no domicílio era pensionista, empregado(a) doméstico(a) ou parente do(a) empregado(a) doméstico(a)"
description = "Valor do rendimento nominal mediano mensal domiciliar per capita dos moradores em domicílios particulares permanentes ocupados, exclusive os cuja condição no domicílio era pensionista, empregado(a) doméstico(a) ou parente do(a) empregado(a) doméstico(a)"
dataset = "ibge-medida-t10295-v13534"
variable = "13534"
fact = "fact_medida_t10295_v13534"
column = "valor"
unit = "Reais"
additivity = "non_additive"
concept = "rendimento_domiciliar_censo_v13534"
path = ["Trabalho e rendimento", "Rendimento domiciliar, desigualdade e pobreza"]
caveats = ["Medida nativa da tabela SIDRA 10295, variável 13534, no Total das classificações. Não herda cruzamentos ou detalhamentos de outras tabelas.", "Médias, razões, taxas e limites de confiança mantêm os valores oficiais; não são obtidos pela soma de municípios, UFs ou categorias.", "1) Dados dos resultados preliminares da amostra, estimados a partir de áreas de ponderação preliminares.", "2) Exclusive não moradores em domicílios particulares permanentes e pessoas cuja condição no arranjo domiciliar era pensionista, empregado doméstico ou parente do empregado doméstico.", "3) A categoria Total de cor ou raça inclui os ignorados omitidos na tabela.", "4) No Censo Demográfico 2022, definiu-se como indígena a pessoa residente em localidades indígenas que se declarou indígena pelo quesito de cor ou raça ou pelo quesito se considera indígena; ou a pessoa residente fora das localidades indígenas que se declarou indígena no quesito de cor ou raça. Por essa razão, o total de pessoas indígenas é superior ou igual ao total de pessoas de cor ou raça declarada indígena, nos diferentes recortes.", "5) No Censo Demográfico 2022, foram consideradas localidades indígenas aquelas que compõem o conjunto das Terras Indígenas, dos agrupamentos indígenas e das demais áreas de conhecida ou potencial ocupação indígena. Para mais detalhes, consultar a documentação metodológica.", "6) No Censo Demográfico 2022, foram consideradas as Terras Indígenas declaradas, homologadas, regularizadas ou encaminhadas como Reservas Indígenas até 31 de julho de 2022, data de referência da pesquisa, conforme os dados da Fundação Nacional dos Povos Indígenas – FUNAI. Para mais informações, consultar a documentação metodológica."]

