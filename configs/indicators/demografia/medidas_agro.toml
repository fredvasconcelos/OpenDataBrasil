ses).", "Nestas culturas a área plantada refere-se a área destinada à colheita no ano.", "10 - A diferença entre a área plantada ou destinada à colheita e a área colhida na lavoura é considerada como área perdida.", "11 - A variável Área plantada ou destinada à colheita só passou a ser informada a partir de 1988.", "12 - Valor da produção: Variável derivada calculada pela média ponderada das informações de quantidade e preço médio corrente pago ao produtor, de acordo com os períodos de colheita e comercialização de cada produto. As despesas de frete, taxas e impostos não são incluídas no preço.", "13 - Os dados do último ano divulgado são RESULTADOS PRELIMINARES e podem sofrer alterações até a próxima divulgação."]

