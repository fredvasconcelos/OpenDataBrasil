m ter ciclo vegetativo que ultrapassa 12 meses e, por isso, as informações são computadas nas colheitas realizadas dentro de cada ano civil (12 meses).", "Nestas culturas a área plantada refere-se a área destinada à colheita no ano.", "10 - A diferença entre a área plantada ou destinada à colheita e a área colhida na lavoura é considerada como área perdida.", "11 - A variável Área plantada ou destinada à colheita só passou a ser informada a partir de 1988.", "12 - Valor da produção: Variável derivada calculada pela média ponderada das informações de quantidade e preço médio corrente pago ao produtor, de acordo com os períodos de colheita e comercialização de cada produto. As despesas de frete, taxas e impostos não são incluídas no preço.", "13 - Os dados do último ano divulgado são RESULTADOS PRELIMINARES e podem sofrer alterações até a próxima divulgação."]

[[indicators]]
id = "safra_area_colhida"
name = "Estimativa da safra: área colhida"
description = "Área colhida"
dataset = "ibge-agro-6588-216-ha"
variable = "216"
fact = "fact_agro_6588_216_ha"
column = "valor"
unit = "Hectares"
additivity = "additive"
concept = "safra_area_colhida"
path = ["Agropecuária", "Lavouras"]
first_period = "200609"
caveats = ["LSPA: área colhida da estimativa anual publicada mensalmente, em hectares nativos. Não se somam previsões de meses sucessivos nem produtos hierarquicamente sobrepostos. O Total é o publicado pela fonte; cada produto mantém seu calendário.", "1 - Para as Unidades da Federação que, por força do calendário agrícola, ainda não dispõem das estimativas iniciais, os dados correspondem a uma projeção obtida a partir das informações de anos anteriores;", "2 - As produções de abacaxi e de coco-da-baía são expressas em mil frutos e os seus rendimentos médios em frutos/ha.", "3 - Utilizou-se a padronização de 61% para a conversão da produção do algodão em caroço para caroço de algodão, apenas para a totalização da produção dos cereais, leguminosas e oleaginosas.", "4 - Possíveis diferenças entre somas de parcelas e respectivos totais são provenientes do critério de arredondamento.", "5 - As informações mensais que compõem a série histórica estão disponível a partir de setembro de 2006.", "6 - A partir de janeiro de 2018 foram retirados da divulgação os seguintes produtos: abacaxi, alho, cebola, coco-da-baía, guaraná, maçã, malva, pimenta-do-reino, sisal/agave. Os mesmos continuam sendo acompanhados na pesquisa anual da Produção Agrícola Municipal."]

