first_period = "1974"
caveats = ["Série por produto, sem Total agregado: a nota 7 da 5457 declara o Total indisponível. As 17 frutíferas que mudaram de unidade começam em 2001, o café beneficiado começa em 2002, e cada produto respeita o calendário oficial. Dados na Gold para o seletor de produto do portal, sob responsabilidade do Claude.", "1 - Os municípios sem informação para pelo menos um produto da lavoura não aparecem nas listas;", "2 - A partir do ano de 2001 as quantidades produzidas dos produtos abacate, banana, caqui, figo, goiaba, laranja, limão, maçã, mamão, manga, maracujá, marmelo, melancia, melão, pera, pêssego e tangerina passam a ser expressas em toneladas. Nos anos anteriores eram expressas em mil frutos, com exceção da banana, que era expressa em mil cachos. O rendimento médio passa a ser expresso em Kg/ha. Nos anos anteriores era expresso em frutos/ha, com exceção da banana, que era expressa em cachos/ha.", "3 - Veja em https://sidra.ibge.gov.br/content/documentos/pam/AlteracoesUnidadesMedidaFrutas.pdf um documento com as alterações de unidades de medida das frutíferas ocorridas em 2001 e a tabela de conversão fruto x quilograma.", "4 - Até 2001, café (em coco), a partir de 2002, café (beneficiado ou em grão).", "5 - Os produtos girassol e triticale só apresentam informação a partir de 2005.", "6 - As quantidades produzidas de abacaxi e de coco-da-baía são expressas em mil frutos e o rendimento médio em frutos/ha.", "7 - Valores para a categoria Total indisponíveis para as variáveis Quantidade produzida e Rendimento médio, pois as unidades de medida diferem para determinados produtos.", "8 - Subentende a possibilidade de cultivos sucessivos ou simultâneos (simples, associados e/ou intercalados) no mesmo ano e no mesmo local, podendo, por isto, a área informada da cultura exceder a área geográfica do município.", "9 - As culturas de abacaxi, cana-de-açúcar, mamona e mandioca são consideradas culturas temporárias de longa duração. Elas costumam ter ciclo vegetativo que ultrapassa 12 meses e, por isso, as informações são computadas nas colheitas realizadas dentro de cada ano civil (12 meses).", "Nestas culturas a área plantada refere-se a área destinada à colheita no ano.", "10 - A diferença entre a área plantada ou destinada à colheita e a área colhida na lavoura é considerada como área perdida.", "11 - A variável Área plantada ou destinada à colheita só passou a ser informada a partir de 1988.", "12 - Valor da produção: Variável derivada calculada pela média ponderada das informações de quantidade e preço médio corrente pago ao produtor, de acordo com os períodos de colheita e comercialização de cada produto. As despesas de frete, taxas e impostos não são incluídas no preço.", "13 - Os dados do último ano divulgado são RESULTADOS PRELIMINARES e podem sofrer alterações até a próxima divulgação."]

