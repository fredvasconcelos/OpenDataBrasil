# ------------------------------------------------------------------ fatos temáticos
#
# Cada fato tem granularidade explícita. As medidas são as variáveis dos
# indicadores que apontam para o fato. As classificações viram colunas de
# chave de categoria.

[[facts]]
id = "fact_population_estimate"
dataset = "ibge-sidra-6579"
grain = "território (Brasil, Grande Região, UF, município) x ano"
description = "Estimativas anuais oficiais da população residente. Municípios com instalação prevista para o ano seguinte são marcados (notas oficiais da tabela 6579)."

[[facts]]
id = "fact_census_population"
dataset = "ibge-sidra-4714"
grain = "território x ano censitário"
description = "População residente, área territorial e densidade demográfica do Censo 2022."

[[facts]]
id = "fact_population_by_race"
dataset = "ibge-sidra-9605"
grain = "território x ano censitário x cor ou raça"
description = "População residente por cor ou raça, nos Censos 2010 e 2022."
classifications = { "c86" = "race_category_key" }

[[facts]]
id = "fact_indigenous_population"
dataset = "ibge-sidra-9718"
grain = "território x ano censitário x quesito de declaração indígena x localização do domicílio"
description = "População residente, pessoas indígenas e percentual de indígenas por quesito de declaração e localização em relação a terras indígenas."
classifications = { "c1714" = "declaration_category_key", "c2661" = "location_category_key" }

[[facts]]
id = "fact_quilombola_population"
dataset = "ibge-sidra-9578"
grain = "território x ano censitário x localização do domicílio"
description = "População residente, pessoas quilombolas e percentual de quilombolas por localização em relação a territórios quilombolas."
classifications = { "c2661" = "location_category_key" }

[[facts]]
id = "fact_indigenous_by_sex_age"
dataset = "ibge-sidra-9971"
grain = "território x ano censitário x sexo x grupo de idade x localização do domicílio x situação do domicílio"
description = "Pessoas indígenas por sexo, grupos quinquenais de idade, localização em relação a terras indígenas e situação urbana ou rural."
classifications = { "c2" = "sex_category_key", "c58" = "age_group_category_key", "c2661" = "location_category_key", "c1" = "situation_category_key" }

[[facts]]
id = "fact_indigenous_by_age"
dataset = "ibge-sidra-9970"
grain = "território (Brasil, Grande Região, UF) x ano censitário x idade x localização do domicílio x situação do domicílio"
description = "Pessoas indígenas por idade (grupos, idades simples e meses de vida), localização em relação a terras indígenas e situação urbana ou rural."
classifications = { "c287" = "age_category_key", "c2661" = "location_category_key", "c1" = "situation_category_key" }

[[facts]]
id = "fact_quilombola_territory"
dataset = "ibge-sidra-9723"
grain = "território (níveis administrativos, Amazônia Legal, territórios quilombolas e suas partes por UF) x ano censitário"
description = "População residente e pessoas quilombolas em territórios quilombolas oficialmente delimitados, por território quilombola e por nível administrativo."

[[facts]]
id = "fact_indigenous_land"
dataset = "ibge-sidra-9954"
grain = "território (Brasil, Grandes Regiões, UFs, terras indígenas e suas partes por UF, Coordenações Regionais da Funai, Amazônia Legal) x ano censitário x sexo x grupo de idade x situação do domicílio"
