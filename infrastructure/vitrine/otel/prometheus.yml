# Métricas da Vitrine: API (pelo coletor OpenTelemetry), Caddy (ponta a ponta),
# máquina (node_exporter) e contêineres (cAdvisor).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: odb-api
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: caddy
    static_configs:
      - targets: ["caddy:9180"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
