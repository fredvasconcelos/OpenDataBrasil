# OpenDataBrasil: ambiente local da Fase 1.
#
# Profiles:
#   data  -> postgres + migrate + worker (pipelines, `docker compose run --rm worker odb ...`)
#   test  -> postgres + tests (suíte completa contra o banco odb_test)
#   dev   -> postgres + dev (shell com o código montado do host)
#   web   -> reservado para API/portal (Fase 5); hoje inclui apenas postgres
#
# Orçamento total do projeto: 32 GB de RAM e 16 threads (ADR-0001).
# Limites por serviço são sobrescritos por variáveis ODB_*_CPUS/ODB_*_MEMORY (ex.: no CI).

name: opendatabrasil

x-odb-image: &odb-image
  image: opendatabrasil/odb:${ODB_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
    target: runtime

x-odb-env: &odb-env
  ODB_ENV: ${ODB_ENV:-dev}
  ODB_CONFIG_DIR: /app/configs/environments
  ODB_LAKEHOUSE_ROOT_URI: file:///lakehouse
  ODB_PG_HOST: postgres
  ODB_LOG_LEVEL: ${ODB_LOG_LEVEL:-INFO}
  ODB_DUCKDB_EXTENSION_DIRECTORY: /opt/duckdb/extensions
  POLARS_MAX_THREADS: ${POLARS_MAX_THREADS:-8}

services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    profiles: [data, web, test, dev]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-odb}
      ODB_OWNER_PASSWORD: ${ODB_OWNER_PASSWORD:?defina no .env}
      ODB_PIPELINE_PASSWORD: ${ODB_PIPELINE_PASSWORD:?defina no .env}
      ODB_READER_PASSWORD: ${ODB_READER_PASSWORD:?defina no .env}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=50
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_backups:/backups
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: "${ODB_POSTGRES_MEMORY:-2g}", cpus: "${ODB_POSTGRES_CPUS:-2}" }

  migrate:
    <<: *odb-image
    profiles: [data, test, dev]
    command: ["odb", "db", "upgrade"]
    environment:
      <<: *odb-env
      ODB_PG_USER: odb_owner
      ODB_PG_PASSWORD: ${ODB_OWNER_PASSWORD:?defina no .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }

  worker:
    <<: *odb-image
    profiles: [data]
    command: ["odb", "doctor"]
    environment:
      <<: *odb-env
      ODB_PG_USER: odb_pipeline
      ODB_PG_PASSWORD: ${ODB_PIPELINE_PASSWORD:?defina no .env}
    volumes:
      - lake_bronze:/lakehouse/bronze
      - lake_silver:/lakehouse/silver
      - lake_gold:/lakehouse/gold
      - lake_tmp:/lakehouse/tmp
      - odb_logs:/var/log/odb
      # Exportações para análise local (`odb gold export`). Pasta do host, fora do Git (/data/).
      - ${ODB_EXPORT_HOST_DIR:-./data/exports}:/export
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: "no"
    deploy:
      resources:
        limits: { memory: "${ODB_WORKER_MEMORY:-16g}", cpus: "${ODB_WORKER_CPUS:-8}" }

  # API de consulta (Fase 5, ADR-0009). Só lê: papel odb_reader e Gold montada
  # somente leitura. Bronze e Silver não são montadas (§23.4).
  api:
    <<: *odb-image
    profiles: [web]
    command:
      - uvicorn
      - --factory
      - odb_api.app:create_default_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *odb-env
      ODB_PG_USER: odb_reader
      ODB_PG_PASSWORD: ${ODB_READER_PASSWORD:?defina no .env}
      ODB_DUCKDB_MEMORY_LIMIT: ${ODB_API_DUCKDB_MEMORY:-2GB}
      ODB_DUCKDB_TEMP_DIRECTORY: /lakehouse/tmp/duckdb
      ODB_API_CORS_ORIGINS: ${ODB_API_CORS_ORIGINS:-["http://localhost:3000"]}
      ODB_API_PORTAL_CONFIG_DIR: /app/configs/portal
    volumes:
      - lake_gold:/lakehouse/gold:ro
    tmpfs:
      - /lakehouse/tmp:size=1g,uid=1000,gid=1000
    ports:
      - "127.0.0.1:${ODB_API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: "${ODB_API_MEMORY:-3g}", cpus: "${ODB_API_CPUS:-2}" }

  tests:
    image: opendatabrasil/odb-test:${ODB_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: test
    profiles: [test]
    command: ["pytest", "--cov", "-p", "no:cacheprovider"]
    environment:
      <<: *odb-env
      ODB_ENV: test
      ODB_PG_DATABASE: odb_test
      ODB_PG_USER: odb_owner
      ODB_PG_PASSWORD: ${ODB_OWNER_PASSWORD:?defina no .env}
      ODB_TEST_PIPELINE_PASSWORD: ${ODB_PIPELINE_PASSWORD:?defina no .env}
      ODB_TEST_READER_PASSWORD: ${ODB_READER_PASSWORD:?defina no .env}
      ODB_REQUIRE_INTEGRATION: "1"
    tmpfs:
      - /lakehouse/tmp:size=2g,uid=1000,gid=1000
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy:
      resources:
        limits: { memory: "${ODB_TESTS_MEMORY:-6g}", cpus: "${ODB_TESTS_CPUS:-4}" }

  dev:
    image: opendatabrasil/odb-test:${ODB_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: test
    profiles: [dev]
    command: ["sleep", "infinity"]
    environment:
      <<: *odb-env
      ODB_PG_USER: odb_owner
      ODB_PG_PASSWORD: ${ODB_OWNER_PASSWORD:?defina no .env}
    volumes:
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ./configs:/app/configs
      - lake_bronze:/lakehouse/bronze
      - lake_silver:/lakehouse/silver
      - lake_gold:/lakehouse/gold
      - lake_tmp:/lakehouse/tmp
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${ODB_DEV_MEMORY:-8g}", cpus: "${ODB_DEV_CPUS:-4}" }

volumes:
  lake_bronze:
  lake_silver:
  lake_gold:
  lake_tmp:
  odb_logs:
  pg_data:
  pg_backups:
